<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excavator 360° HMI & Dirt Detection Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #05070a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Exact 1080x1920 (9:16) Portrait HMI Container Regardless of Viewport Scaling */
        .hmi-chassis {
            aspect-ratio: 1080 / 1920;
            height: min(100dvh, calc(100vw * 1920 / 1080));
            width: min(100vw, calc(100dvh * 1080 / 1920));
            background: #0d1017;
            border: 2px solid #262d3d;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Half: 360 Stitched Camera Viewport (50% of 1080x1920) */
        .camera-viewport {
            flex: 0 0 50%;
            position: relative;
            background: #141210;
            border-bottom: 2px solid #2a3242;
            overflow: hidden;
        }

        #cameraCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Critical Alert Pulse Animation */
        @keyframes pulse-danger {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.65); }
            50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }

        .alert-pulse-danger {
            animation: pulse-danger 1.1s infinite;
        }

        /* Top-Center Round Auto Stop Icon Triggered Blink */
        @keyframes pulse-icon-trigger {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.95), 0 0 22px rgba(239, 68, 68, 0.85);
            }
            50% {
                transform: translateX(-50%) scale(1.14);
                box-shadow: 0 0 0 12px rgba(239, 68, 68, 0), 0 0 8px rgba(239, 68, 68, 0.35);
            }
        }

        .auto-stop-icon-triggered {
            animation: pulse-icon-trigger 0.65s infinite ease-in-out;
        }

        @keyframes pulse-boundary-bar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        .boundary-bar-active {
            animation: pulse-boundary-bar 0.9s infinite ease-in-out;
        }

        /* Responsive Drive Buttons */
        .touch-btn {
            touch-action: none;
            transition: transform 0.08s ease, background-color 0.1s ease, border-color 0.1s ease;
        }
        .touch-btn:active, .touch-btn.active-press {
            transform: scale(0.96);
            background-color: #2563eb !important;
            border-color: #60a5fa !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

<div class="hmi-chassis rounded-none sm:rounded-2xl">
    <!-- TOP SYSTEM STATUS BAR (Minimal Industrial Header) -->
    <header class="h-11 px-3.5 bg-[#090b10] border-b border-[#1f2634] flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span class="text-xs font-extrabold tracking-wider text-slate-200 uppercase">360° VIEW</span>
            <span id="speedReadout" class="text-[11px] font-mono-tech font-bold px-2 py-0.5 rounded bg-slate-800/90 text-sky-300 border border-slate-700/70">0.0 km/h</span>
        </div>

        <!-- PRIMARY AUTO STOP STATUS PILL -->
        <div id="autoStopPill" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-950/90 border border-emerald-500/70 text-emerald-300 transition-colors duration-200">
            <svg id="autoStopIcon" class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            <span id="autoStopPillText" class="text-[11px] font-extrabold tracking-wide uppercase">AUTO STOP: ON</span>
        </div>
    </header>

    <!-- UPPER HALF: 360° STITCHED CAMERA VIEWPORT -->
    <section class="camera-viewport" id="cameraViewport">
        <canvas id="cameraCanvas"></canvas>

        <!-- TOP CENTER ROUND AUTO STOP STATUS ICON (Blinks when Auto Stop is triggered) -->
        <div id="centerAutoStopIcon" title="Auto Stop Status" class="absolute top-2.5 left-1/2 -translate-x-1/2 w-11 h-11 rounded-full bg-emerald-600/95 border-2 border-emerald-200 shadow-lg flex items-center justify-center z-20 transition-colors duration-200 pointer-events-none">
            <svg id="centerAutoStopSvg" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
        </div>

        <!-- SWING BOUNDARY LIMIT VISUAL INDICATORS (Vertical Orange Bars on Left/Right Viewport Edges) -->
        <div id="leftBoundaryBar" class="hidden absolute inset-y-0 left-0 w-3 bg-gradient-to-r from-orange-500 via-amber-500 to-transparent shadow-[0_0_22px_rgba(249,115,22,0.95)] border-l-4 border-orange-300 z-25 pointer-events-none boundary-bar-active flex items-center">
            <div class="bg-orange-500 text-slate-950 font-mono-tech font-black text-[9px] px-1 py-2 rounded-r shadow-md tracking-tighter" style="writing-mode: vertical-rl; transform: rotate(180deg);">
                L-LIMIT
            </div>
        </div>
        <div id="rightBoundaryBar" class="hidden absolute inset-y-0 right-0 w-3 bg-gradient-to-l from-orange-500 via-amber-500 to-transparent shadow-[0_0_22px_rgba(249,115,22,0.95)] border-r-4 border-orange-300 z-25 pointer-events-none boundary-bar-active flex items-center justify-end">
            <div class="bg-orange-500 text-slate-950 font-mono-tech font-black text-[9px] px-1 py-2 rounded-l shadow-md tracking-tighter" style="writing-mode: vertical-rl;">
                R-LIMIT
            </div>
        </div>

        <!-- MINIMAL HUD TOP OVERLAY: Rain & 4-Lens Health -->
        <div class="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between pointer-events-none z-10">
            <div class="bg-slate-950/80 backdrop-blur-sm border border-slate-700/70 rounded-lg px-2 py-1 flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/>
                </svg>
                <span class="text-[10px] font-bold text-slate-200 uppercase">RAIN</span>
            </div>

            <!-- 4-Camera Health Indicators -->
            <div class="bg-slate-950/80 backdrop-blur-sm border border-slate-700/70 rounded-lg px-2 py-1 flex items-center gap-1">
                <span id="badge-front" class="text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/40">F:OK</span>
                <span id="badge-rear" class="text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/40">R:OK</span>
                <span id="badge-left" class="text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/40">L:OK</span>
                <span id="badge-right" class="text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/40">RGT:OK</span>
            </div>
        </div>

        <!-- AUTO STOP TRIGGERED BANNER (Locks drive while person is in range, stays visible at least 3s) -->
        <div id="emergencyBrakeBanner" class="hidden absolute top-16 left-3 right-3 bg-red-600/95 border-2 border-white rounded-xl px-3.5 py-2.5 shadow-2xl flex items-center gap-3 z-30 alert-pulse-danger">
            <div class="w-8 h-8 rounded-full bg-white text-red-600 flex items-center justify-center font-black text-base shrink-0">!</div>
            <div class="min-w-0">
                <div class="text-xs font-black tracking-wider uppercase text-white">AUTO STOP ACTIVATED</div>
                <div class="text-[11px] font-medium text-red-100">Person inside safety zone — Drive locked until clear.</div>
            </div>
        </div>

        <!-- SIMPLE DIRT DETECTION NOTICE (Shows dirty camera & Auto Stop failure, no wash button) -->
        <div id="dirtAlertOverlay" class="hidden absolute bottom-2.5 left-2.5 right-2.5 z-20 pointer-events-none transition-all duration-200">
            <div class="bg-[#181612]/95 border-2 border-amber-500 rounded-xl px-3.5 py-2.5 flex items-center gap-3 shadow-2xl">
                <div id="dirtAlertIconWrap" class="w-9 h-9 rounded-lg bg-amber-500/20 border border-amber-500/60 flex items-center justify-center shrink-0 text-amber-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <div class="min-w-0">
                    <div id="dirtAlertTitle" class="text-xs font-extrabold uppercase tracking-wide text-amber-300">DIRTY CAMERA</div>
                    <div id="dirtAlertMsg" class="text-xs font-semibold text-white">Auto Stop is not working properly.</div>
                </div>
            </div>
        </div>
    </section>

    <!-- LOWER HALF: CLEAN OPERATOR CONTROLS & SIMULATION SETTINGS (Zero Scrollbar, Full Area Utilization) -->
    <main class="flex-1 min-h-0 bg-[#11151d] p-2.5 flex flex-col justify-between gap-2 overflow-hidden">
        
        <!-- 1. DRIVE & SWING PAD -->
        <div class="bg-[#161c26] border border-[#252e3d] rounded-xl p-2.5 flex-1 flex flex-col justify-between min-h-0">
            <div class="flex items-center justify-between mb-1.5">
                <div class="flex items-center gap-2">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Drive & Swing</span>
                    <span id="cabAngleReadout" class="text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-slate-800 text-amber-300 border border-slate-700">0°</span>
                </div>
                <span class="text-[10px] font-mono-tech text-slate-500">WASD / Q·C·E</span>
            </div>

            <div class="grid grid-cols-3 gap-2 items-stretch flex-1 min-h-0">
                <!-- Left / Right Track Steer -->
                <div class="grid grid-cols-2 gap-1.5">
                    <button id="btn-left" class="touch-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl py-2 flex flex-col items-center justify-center text-slate-200 font-bold text-xs">
                        <span>◀</span>
                        <span class="text-[10px] mt-0.5">LEFT</span>
                    </button>
                    <button id="btn-right" class="touch-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl py-2 flex flex-col items-center justify-center text-slate-200 font-bold text-xs">
                        <span>▶</span>
                        <span class="text-[10px] mt-0.5">RIGHT</span>
                    </button>
                </div>

                <!-- Forward / Reverse -->
                <div class="flex flex-col gap-1.5">
                    <button id="btn-up" class="touch-btn flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl py-2 flex items-center justify-center text-slate-200 font-bold text-xs">
                        ▲ FWD
                    </button>
                    <button id="btn-down" class="touch-btn flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl py-2 flex items-center justify-center text-slate-200 font-bold text-xs">
                        ▼ REV
                    </button>
                </div>

                <!-- Wash & Two-Way Cab Swing + Center Reset -->
                <div class="flex flex-col gap-1.5">
                    <button onclick="cleanCameras()" class="flex-1 bg-sky-950 hover:bg-sky-900 active:scale-95 border border-sky-500/60 rounded-xl py-2 px-2 text-sky-200 font-bold text-xs flex items-center justify-center gap-1.5 transition">
                        <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        <span>WASH</span>
                    </button>
                    <div class="grid grid-cols-3 gap-1 flex-1">
                        <button id="btn-swing-left" class="touch-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl py-2 flex items-center justify-center text-slate-200 font-bold text-xs" title="Swing Left (Q)">
                            ↺ L
                        </button>
                        <button id="btn-swing-reset" onclick="resetCabSwing()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 rounded-xl py-2 flex items-center justify-center text-amber-300 font-bold text-[10px]" title="Center Cab (C)">
                            0°
                        </button>
                        <button id="btn-swing-right" class="touch-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl py-2 flex items-center justify-center text-slate-200 font-bold text-xs" title="Swing Right (E)">
                            ↻ R
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. SWING BOUNDARY LIMIT CONTROLS -->
        <div class="bg-[#161c26] border border-[#252e3d] rounded-xl px-2.5 py-2 shrink-0">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Swing Limit</span>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="setSwingLimitPreset(null, null)" id="limit-off" class="px-2 py-1 rounded-md text-[10px] font-mono-tech font-bold bg-orange-600 text-white border border-orange-400">OFF</button>
                    <button onclick="setSwingLimitPreset(45, 45)" id="limit-45" class="px-2 py-1 rounded-md text-[10px] font-mono-tech font-bold bg-slate-800 text-slate-300 border border-slate-600">±45°</button>
                    <button onclick="setSwingLimitPreset(90, 90)" id="limit-90" class="px-2 py-1 rounded-md text-[10px] font-mono-tech font-bold bg-slate-800 text-slate-300 border border-slate-600">±90°</button>
                    <button onclick="setSwingLimitPreset(135, 135)" id="limit-135" class="px-2 py-1 rounded-md text-[10px] font-mono-tech font-bold bg-slate-800 text-slate-300 border border-slate-600">±135°</button>
                </div>
            </div>

            <!-- Individual Left / Right Boundary Fine-Tuning -->
            <div class="grid grid-cols-2 gap-2 mt-1.5">
                <div class="bg-slate-900/90 border border-slate-700/80 rounded-lg px-2 py-1 flex items-center justify-between">
                    <span class="text-[10px] font-bold text-orange-300">Left Limit</span>
                    <div class="flex items-center gap-1.5">
                        <button onclick="adjustSideLimit('left', -15)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 text-white font-bold text-xs">−</button>
                        <span id="leftLimitLabel" class="font-mono-tech text-[11px] font-bold text-slate-200 w-9 text-center">OFF</span>
                        <button onclick="adjustSideLimit('left', 15)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 text-white font-bold text-xs">+</button>
                    </div>
                </div>
                <div class="bg-slate-900/90 border border-slate-700/80 rounded-lg px-2 py-1 flex items-center justify-between">
                    <span class="text-[10px] font-bold text-orange-300">Right Limit</span>
                    <div class="flex items-center gap-1.5">
                        <button onclick="adjustSideLimit('right', -15)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 text-white font-bold text-xs">−</button>
                        <span id="rightLimitLabel" class="font-mono-tech text-[11px] font-bold text-slate-200 w-9 text-center">OFF</span>
                        <button onclick="adjustSideLimit('right', 15)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 text-white font-bold text-xs">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. SIMULATION CONTROLS (People Count + Dirt Triggers) -->
        <div class="bg-[#161c26] border border-[#252e3d] rounded-xl p-2.5 space-y-2 shrink-0">
            <!-- Row 1: People Counter & Auto Rain Mud -->
            <div class="grid grid-cols-2 gap-2">
                <!-- People Count Control (Default: 1) -->
                <div class="bg-slate-900/90 border border-slate-700/80 rounded-lg px-2.5 py-1.5 flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-300">People</span>
                    <div class="flex items-center gap-2">
                        <button onclick="changeWorkerCount(-1)" class="w-6 h-6 rounded-md bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 text-white font-bold text-sm flex items-center justify-center">−</button>
                        <span id="workerCountDisplay" class="font-mono-tech text-sm font-bold text-white w-4 text-center">1</span>
                        <button onclick="changeWorkerCount(1)" class="w-6 h-6 rounded-md bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 text-white font-bold text-sm flex items-center justify-center">+</button>
                    </div>
                </div>

                <!-- Auto Mud Build-up Toggle -->
                <label class="bg-slate-900/90 border border-slate-700/80 rounded-lg px-2.5 py-1.5 flex items-center justify-between cursor-pointer">
                    <span class="text-xs font-bold text-slate-300">Auto Mud</span>
                    <input type="checkbox" id="autoDirtToggle" checked class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                </label>
            </div>

            <!-- Row 2: Instant Dirt Injection Buttons -->
            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="triggerDirtOnSector('front')" class="bg-amber-950/60 hover:bg-amber-900/70 active:scale-95 border border-amber-600/50 text-amber-200 text-xs font-bold py-1.5 rounded-lg transition">
                    + Mud Front
                </button>
                <button onclick="triggerDirtOnSector('rear')" class="bg-amber-950/60 hover:bg-amber-900/70 active:scale-95 border border-amber-600/50 text-amber-200 text-xs font-bold py-1.5 rounded-lg transition">
                    + Mud Rear
                </button>
                <button onclick="triggerDirtOnSector('all')" class="bg-red-950/60 hover:bg-red-900/70 active:scale-95 border border-red-600/50 text-red-200 text-xs font-bold py-1.5 rounded-lg transition">
                    + Mud All
                </button>
            </div>
        </div>

        <!-- 4. APP VERSION & GITHUB UPDATE BAR -->
        <div class="bg-[#161c26] border border-[#252e3d] rounded-xl px-2.5 py-1.5 flex items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-2 min-w-0">
                <span id="appVersionBadge" class="text-[11px] font-mono-tech font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700 shrink-0">v1.5.1</span>
                <span id="updateStatusText" class="text-[11px] text-slate-400 truncate">Ready</span>
            </div>
            <button id="btnCheckUpdate" onclick="fetchLatestUpdate()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-600 rounded-lg px-2.5 py-1 text-sky-300 font-bold text-[11px] flex items-center gap-1.5 transition shrink-0">
                <svg id="updateIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span>Update</span>
            </button>
        </div>
    </main>
</div>

<script>
/**
 * EXCAVATOR 360° HMI & DIRT DETECTION SIMULATOR
 * Complete Verified Build: 1080x1920 Ratio, Swing Reset & Left/Right Boundary Limits
 */
const APP_VERSION = 'v1.5.1';

async function fetchLatestUpdate() {
    const btn = document.getElementById('btnCheckUpdate');
    const statusText = document.getElementById('updateStatusText');
    const icon = document.getElementById('updateIcon');

    if (btn) btn.disabled = true;
    if (icon) icon.classList.add('animate-spin');
    if (statusText) {
        statusText.textContent = 'Checking GitHub...';
        statusText.className = 'text-[11px] text-sky-300 truncate';
    }

    try {
        if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const reg of registrations) {
                await reg.update();
                await reg.unregister();
            }
        }
        if ('caches' in window) {
            const cacheKeys = await caches.keys();
            await Promise.all(cacheKeys.map(key => caches.delete(key)));
        }

        const baseUrl = window.location.href.split('?')[0].split('#')[0];
        const freshUrl = `${baseUrl}?v=${Date.now()}`;
        await fetch(freshUrl, { cache: 'no-store' });

        if (statusText) {
            statusText.textContent = 'Updating...';
            statusText.className = 'text-[11px] text-emerald-400 font-bold truncate';
        }

        setTimeout(() => {
            window.location.replace(freshUrl);
        }, 350);
    } catch (err) {
        if (statusText) {
            statusText.textContent = 'Reloading latest...';
            statusText.className = 'text-[11px] text-amber-300 truncate';
        }
        setTimeout(() => {
            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            window.location.replace(`${baseUrl}?v=${Date.now()}`);
        }, 400);
    }
}

// --- AUDIO ENGINE (Synthesized HMI Chimes & Alerts, No External Audio Files) ---
class HmiAudio {
    constructor() {
        this.ctx = null;
        this.lastWarnTime = 0;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playAutoStopAlert() {
        const now = Date.now();
        if (now - this.lastWarnTime < 1200) return;
        this.lastWarnTime = now;
        this.init();
        if (!this.ctx) return;

        [0, 0.16, 0.32].forEach((offset) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, this.ctx.currentTime + offset);
            osc.frequency.exponentialRampToValueAtTime(620, this.ctx.currentTime + offset + 0.12);
            gain.gain.setValueAtTime(0.14, this.ctx.currentTime + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + offset + 0.13);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + offset);
            osc.stop(this.ctx.currentTime + offset + 0.14);
        });
    }

    playDirtDegradeChime() {
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
        osc.frequency.setValueAtTime(440, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.42);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.45);
    }

    playWashSound() {
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(760, this.ctx.currentTime + 0.28);
        gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }

    playBoundaryLimit() {
        const now = Date.now();
        if (now - this.lastWarnTime < 700) return;
        this.lastWarnTime = now;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.setValueAtTime(420, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }
}

// --- CANVAS SETUP ---
const canvas = document.getElementById('cameraCanvas');
const ctx = canvas.getContext('2d');
let canvasW = 600;
let canvasH = 400;

function resizeCanvas() {
    const container = document.getElementById('cameraViewport');
    if (!container) return;
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvasW = Math.max(100, rect.width);
    canvasH = Math.max(100, rect.height);
    canvas.width = canvasW * dpr;
    canvas.height = canvasH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resizeCanvas);

// --- INITIALIZE ENVIRONMENT & DEFAULT 1 WORKER FAR AWAY ---
function initEnvironment() {
    resizeCanvas();
    state.raindrops = [];
    for (let i = 0; i < 95; i++) {
        state.raindrops.push({
            x: Math.random() * 1400,
            y: Math.random() * 1000,
            len: 12 + Math.random() * 16,
            speed: 9 + Math.random() * 6
        });
    }

    state.mudSplashes = [];
    for (let i = 0; i < 45; i++) {
        state.mudSplashes.push({
            x: (Math.random() - 0.5) * 2600,
            y: (Math.random() - 0.5) * 2600,
            r: 18 + Math.random() * 42
        });
    }

    // Default: 1 person starting safely far from the excavator
    setWorkerCount(1);
    updateHmiDirtStatus();
    updateSwingLimitUI();
}

// --- SWING RESET & BOUNDARY LIMIT LOGIC ---
function normalizeAngleRad(angle) {
    let a = ((angle + Math.PI) % (Math.PI * 2));
    if (a < 0) a += Math.PI * 2;
    return a - Math.PI;
}

function resetCabSwing() {
    hmiAudio.init();
    state.excavator.cabAngle = normalizeAngleRad(state.excavator.cabAngle);
    state.excavator.centeringCab = true;
}

function setSwingLimitPreset(leftDeg, rightDeg) {
    hmiAudio.init();
    state.swingLimits.leftDeg = leftDeg;
    state.swingLimits.rightDeg = rightDeg;

    if (leftDeg !== null || rightDeg !== null) {
        state.excavator.cabAngle = normalizeAngleRad(state.excavator.cabAngle);
    }
    updateSwingLimitUI();
}

function adjustSideLimit(side, deltaDeg) {
    hmiAudio.init();
    const key = side === 'left' ? 'leftDeg' : 'rightDeg';
    const current = state.swingLimits[key];

    if (current === null) {
        state.swingLimits[key] = 90;
        state.excavator.cabAngle = normalizeAngleRad(state.excavator.cabAngle);
    } else {
        const next = current + deltaDeg;
        if (next > 175 || next < 15) {
            state.swingLimits[key] = null;
        } else {
            state.swingLimits[key] = next;
            state.excavator.cabAngle = normalizeAngleRad(state.excavator.cabAngle);
        }
    }
    updateSwingLimitUI();
}

function updateSwingLimitUI() {
    const { leftDeg, rightDeg } = state.swingLimits;
    const leftLabel = document.getElementById('leftLimitLabel');
    const rightLabel = document.getElementById('rightLimitLabel');
    if (leftLabel) leftLabel.textContent = leftDeg !== null ? `${leftDeg}°` : 'OFF';
    if (rightLabel) rightLabel.textContent = rightDeg !== null ? `${rightDeg}°` : 'OFF';

    const presets = [
        { id: 'limit-off', active: leftDeg === null && rightDeg === null },
        { id: 'limit-45', active: leftDeg === 45 && rightDeg === 45 },
        { id: 'limit-90', active: leftDeg === 90 && rightDeg === 90 },
        { id: 'limit-135', active: leftDeg === 135 && rightDeg === 135 }
    ];
    presets.forEach(p => {
        const el = document.getElementById(p.id);
        if (!el) return;
        el.className = p.active
            ? 'px-2 py-1 rounded-md text-[10px] font-mono-tech font-bold bg-orange-600 text-white border border-orange-400'
            : 'px-2 py-1 rounded-md text-[10px] font-mono-tech font-bold bg-slate-800 text-slate-300 border border-slate-600';
    });
}

function syncBoundaryIndicators() {
    const leftBar = document.getElementById('leftBoundaryBar');
    const rightBar = document.getElementById('rightBoundaryBar');
    if (!leftBar || !rightBar) return;

    if (state.swingLimits.hitSide === 'left') {
        leftBar.classList.remove('hidden');
        rightBar.classList.add('hidden');
    } else if (state.swingLimits.hitSide === 'right') {
        rightBar.classList.remove('hidden');
        leftBar.classList.add('hidden');
    } else {
        leftBar.classList.add('hidden');
        rightBar.classList.add('hidden');
    }
}

// --- WORKER MANAGEMENT ---
function createFarWorker(index) {
    const baseAngles = [-0.55, 2.4, 1.35, -1.9, 0.7, -2.7, 1.9, -1.1];
    const angle = baseAngles[index % baseAngles.length] + (Math.random() - 0.5) * 0.25;
    const dist = 285 + (index * 24);
    const speed = 0.55 + Math.random() * 0.25;
    const moveAngle = angle + Math.PI + (Math.random() - 0.5) * 0.9;

    return {
        id: index + 1,
        x: state.excavator.x + Math.cos(angle) * dist,
        y: state.excavator.y + Math.sin(angle) * dist,
        vx: Math.cos(moveAngle) * speed,
        vy: Math.sin(moveAngle) * speed,
        detected: false,
        sector: 'front',
        walkPhase: Math.random() * Math.PI * 2
    };
}

function setWorkerCount(count) {
    const target = Math.max(0, Math.min(8, count));
    while (state.workers.length < target) {
        state.workers.push(createFarWorker(state.workers.length));
    }
    while (state.workers.length > target) {
        state.workers.pop();
    }
    const displayEl = document.getElementById('workerCountDisplay');
    if (displayEl) displayEl.textContent = String(state.workers.length);
}

function changeWorkerCount(delta) {
    hmiAudio.init();
    setWorkerCount(state.workers.length + delta);
}

// --- DIRT & CAMERA LOGIC ---
function addDirtBlob(sector, amount) {
    const cam = state.cameras[sector];
    if (!cam) return;
    cam.dirt = Math.min(100, cam.dirt + amount);

    const targetBlobs = Math.floor(cam.dirt / 5);
    while (cam.blobs.length < targetBlobs) {
        cam.blobs.push({
            u: (Math.random() - 0.5) * 1.65,
            v: 0.22 + Math.random() * 0.76,
            r: 14 + Math.random() * 28,
            opacity: 0.55 + Math.random() * 0.35
        });
    }
    updateHmiDirtStatus();
}

function triggerDirtOnSector(target) {
    hmiAudio.init();
    if (target === 'all') {
        ['front', 'rear', 'left', 'right'].forEach(s => addDirtBlob(s, 75));
    } else {
        addDirtBlob(target, 75);
    }
}

function cleanCameras() {
    hmiAudio.playWashSound();
    state.washerWave = 1.0;
    ['front', 'rear', 'left', 'right'].forEach(s => {
        state.cameras[s].dirt = 0;
        state.cameras[s].blobs = [];
    });
    updateHmiDirtStatus();
}

function getSectorForAngle(relAngle) {
    let a = ((relAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    if (a >= Math.PI * 1.75 || a < Math.PI * 0.25) return 'front';
    if (a >= Math.PI * 0.25 && a < Math.PI * 0.75) return 'right';
    if (a >= Math.PI * 0.75 && a < Math.PI * 1.25) return 'rear';
    return 'left';
}

function updateHmiDirtStatus() {
    const sectors = ['front', 'rear', 'left', 'right'];
    const labels = { front: 'FRONT', rear: 'REAR', left: 'LEFT', right: 'RIGHT' };
    const shortLabels = { front: 'F', rear: 'R', left: 'L', right: 'RGT' };

    let degradedList = [];
    let failedList = [];

    sectors.forEach(s => {
        const dirt = state.cameras[s].dirt;
        const badge = document.getElementById(`badge-${s}`);
        if (!badge) return;

        if (dirt >= state.dirtThresholdFail) {
            failedList.push(labels[s]);
            badge.textContent = `${shortLabels[s]}:DIRT`;
            badge.className = 'text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-red-950/90 text-red-300 border border-red-500/70';
        } else if (dirt >= state.dirtThresholdWarn) {
            degradedList.push(labels[s]);
            badge.textContent = `${shortLabels[s]}:LOW`;
            badge.className = 'text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-amber-950/90 text-amber-300 border border-amber-500/70';
        } else {
            badge.textContent = `${shortLabels[s]}:OK`;
            badge.className = 'text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/40';
        }
    });

    const pill = document.getElementById('autoStopPill');
    const pillText = document.getElementById('autoStopPillText');
    const alertBox = document.getElementById('dirtAlertOverlay');
    const alertTitle = document.getElementById('dirtAlertTitle');
    const alertMsg = document.getElementById('dirtAlertMsg');
    const alertIconWrap = document.getElementById('dirtAlertIconWrap');

    const affected = [...failedList, ...degradedList];
    let currentSystemState = 'OK';

    if (failedList.length > 0) {
        currentSystemState = 'FAIL';
        pill.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-red-950/90 border border-red-500 text-red-200 transition-colors duration-200';
        pillText.textContent = failedList.length === 4 ? 'AUTO STOP: OFF' : 'AUTO STOP: LIMITED';

        alertBox.classList.remove('hidden');
        alertBox.className = 'bg-[#191418]/95 border-2 border-red-500 rounded-xl px-3.5 py-2.5 flex items-center gap-3 shadow-2xl';
        alertIconWrap.className = 'w-9 h-9 rounded-lg bg-red-500/20 border border-red-500/60 flex items-center justify-center shrink-0 text-red-400';
        alertTitle.className = 'text-xs font-extrabold uppercase tracking-wide text-red-300';
        alertTitle.textContent = `DIRTY CAMERA: ${affected.join(', ')}`;
        alertMsg.textContent = failedList.length === 4
            ? 'Auto Stop is disabled.'
            : `Auto Stop is not working properly (${failedList.join(', ')}).`;
    } else if (degradedList.length > 0) {
        currentSystemState = 'WARN';
        pill.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-950/90 border border-amber-500 text-amber-200 transition-colors duration-200';
        pillText.textContent = 'AUTO STOP: LIMITED';

        alertBox.classList.remove('hidden');
        alertBox.className = 'bg-[#1a1814]/95 border-2 border-amber-500 rounded-xl px-3.5 py-2.5 flex items-center gap-3 shadow-2xl';
        alertIconWrap.className = 'w-9 h-9 rounded-lg bg-amber-500/20 border border-amber-500/60 flex items-center justify-center shrink-0 text-amber-400';
        alertTitle.className = 'text-xs font-extrabold uppercase tracking-wide text-amber-300';
        alertTitle.textContent = `DIRTY CAMERA: ${degradedList.join(', ')}`;
        alertMsg.textContent = 'Auto Stop is not working properly.';
    } else {
        currentSystemState = 'OK';
        pill.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-950/90 border border-emerald-500/70 text-emerald-300 transition-colors duration-200';
        pillText.textContent = 'AUTO STOP: ON';
        alertBox.classList.add('hidden');
    }

    if (currentSystemState !== 'OK' && state.prevSystemState === 'OK') {
        hmiAudio.playDirtDegradeChime();
    }
    state.prevSystemState = currentSystemState;
    syncCenterAutoStopIcon();
}

// --- CONTROLS: KEYBOARD + TOUCH ---
function bindControlButton(id, keyName) {
    const el = document.getElementById(id);
    if (!el) return;

    const press = (e) => {
        e.preventDefault();
        hmiAudio.init();
        state.keys[keyName] = true;
        el.classList.add('active-press');
    };
    const release = (e) => {
        if (e) e.preventDefault();
        state.keys[keyName] = false;
        el.classList.remove('active-press');
    };

    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
}

bindControlButton('btn-up', 'up');
bindControlButton('btn-down', 'down');
bindControlButton('btn-left', 'left');
bindControlButton('btn-right', 'right');
bindControlButton('btn-swing-left', 'swingLeft');

// --- SIMULATION LOOP ---
let lastTrackDropX = 0;
let lastTrackDropY = 0;

function updateSimulation() {
    const ex = state.excavator;
    const stopZoneRadius = 96;
    const machinePhysicalRadius = 46;

    // 1. Pre-check whether any detected person is inside the Auto Stop range
    let personInDangerZone = false;
    for (const w of state.workers) {
        const dx = w.x - ex.x;
        const dy = w.y - ex.y;
        const dist = Math.hypot(dx, dy);
        const worldAngle = Math.atan2(dy, dx) + Math.PI / 2;
        const relAngle = worldAngle - ex.heading;
        const sector = getSectorForAngle(relAngle);
        const camDirt = state.cameras[sector].dirt;
        const canDetect = camDirt < state.dirtThresholdFail;

        if (canDetect && dist < stopZoneRadius) {
            personInDangerZone = true;
            break;
        }
    }

    // Machine driving & swinging stay completely locked until person is outside Auto Stop range
    if (!personInDangerZone) {
        state.emergencyBraking = false;
    }

    // 2. Excavator movement & track animation
    if (state.emergencyBraking) {
        ex.speed = 0;
    } else {
        if (state.keys.up) {
            ex.speed = Math.min(ex.maxSpeed, ex.speed + 0.14);
        } else if (state.keys.down) {
            ex.speed = Math.max(-ex.maxSpeed * 0.75, ex.speed - 0.14);
        } else {
            ex.speed *= 0.86;
            if (Math.abs(ex.speed) < 0.03) ex.speed = 0;
        }

        let turnInput = 0;
        if (state.keys.left) {
            ex.heading -= ex.turnSpeed;
            turnInput = -1;
        }
        if (state.keys.right) {
            ex.heading += ex.turnSpeed;
            turnInput = 1;
        }

        // Smooth, stepless upperstructure swing (left & right with hydraulic inertia, reset & boundary limits)
        if (state.keys.swingLeft || state.keys.swingRight) {
            ex.centeringCab = false;
        }

        let targetSwingVel = 0;
        if (ex.centeringCab) {
            const diff = -ex.cabAngle;
            if (Math.abs(diff) < 0.012) {
                ex.cabAngle = 0;
                ex.cabSwingVel = 0;
                ex.centeringCab = false;
            } else {
                targetSwingVel = Math.max(-0.055, Math.min(0.055, diff * 0.16));
            }
        } else {
            if (state.keys.swingLeft) targetSwingVel -= 0.042;
            if (state.keys.swingRight) targetSwingVel += 0.042;
        }

        ex.cabSwingVel += (targetSwingVel - ex.cabSwingVel) * 0.22;
        if (Math.abs(ex.cabSwingVel) < 0.0002) ex.cabSwingVel = 0;
        ex.cabAngle += ex.cabSwingVel;

        // Enforce Left / Right Swing Boundary Limits
        let hitSide = null;
        const prevHitSide = state.swingLimits.hitSide;
        if (state.swingLimits.leftDeg !== null) {
            const minRad = -(state.swingLimits.leftDeg * Math.PI) / 180;
            if (ex.cabAngle <= minRad + 0.002) {
                ex.cabAngle = minRad;
                if (ex.cabSwingVel < 0) ex.cabSwingVel = 0;
                hitSide = 'left';
            }
        }
        if (state.swingLimits.rightDeg !== null) {
            const maxRad = (state.swingLimits.rightDeg * Math.PI) / 180;
            if (ex.cabAngle >= maxRad - 0.002) {
                ex.cabAngle = maxRad;
                if (ex.cabSwingVel > 0) ex.cabSwingVel = 0;
                hitSide = 'right';
            }
        }
        state.swingLimits.hitSide = hitSide;
        if (hitSide && hitSide !== prevHitSide) {
            hmiAudio.playBoundaryLimit();
        }
        syncBoundaryIndicators();

        // Update live cab swing angle readout
        const degDisplay = Math.round((normalizeAngleRad(ex.cabAngle) * 180) / Math.PI);
        const angleEl = document.getElementById('cabAngleReadout');
        if (angleEl) {
            angleEl.textContent = `${degDisplay > 0 ? '+' : ''}${degDisplay}°`;
            angleEl.className = hitSide
                ? 'text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-orange-500 text-slate-950 border border-orange-300'
                : 'text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-slate-800 text-amber-300 border border-slate-700';
        }

        // Animate caterpillar track links clearly when driving or counter-rotating
        ex.leftTrackOffset += ex.speed + turnInput * 1.4;
        ex.rightTrackOffset += ex.speed - turnInput * 1.4;
    }

    const vx = Math.sin(ex.heading) * ex.speed;
    const vy = -Math.cos(ex.heading) * ex.speed;
    ex.x += vx;
    ex.y += vy;

    // Leave visible caterpillar track impressions in the wet ground
    if (Math.hypot(ex.x - lastTrackDropX, ex.y - lastTrackDropY) > 14) {
        lastTrackDropX = ex.x;
        lastTrackDropY = ex.y;
        state.trackMarks.push({ x: ex.x, y: ex.y, heading: ex.heading, alpha: 0.45 });
        if (state.trackMarks.length > 70) state.trackMarks.shift();
    }

    // Update speed readout
    const kmh = (Math.abs(ex.speed) * 2.4).toFixed(1);
    document.getElementById('speedReadout').textContent = `${kmh} km/h`;

    // 3. Gradual mud splatter buildup while driving in rain
    const autoDirt = document.getElementById('autoDirtToggle').checked;
    if (autoDirt && (Math.abs(ex.speed) > 0.25 || state.keys.left || state.keys.right)) {
        if (Math.random() < 0.03) {
            const targetCam = ex.speed >= 0
                ? (Math.random() < 0.7 ? 'front' : (Math.random() < 0.5 ? 'left' : 'right'))
                : 'rear';
            addDirtBlob(targetCam, 1.3);
        }
    }

    // 4. Update workers, enforce physical machine collision & check Auto Stop
    let dangerTriggeredThisFrame = false;

    for (const w of state.workers) {
        w.x += w.vx;
        w.y += w.vy;
        w.walkPhase += 0.14;

        let dx = w.x - ex.x;
        let dy = w.y - ex.y;
        let dist = Math.hypot(dx, dy);

        // Prevent workers from walking underneath/through the excavator body
        if (dist < machinePhysicalRadius) {
            const pushAngle = dist > 0.001 ? Math.atan2(dy, dx) : Math.random() * Math.PI * 2;
            w.x = ex.x + Math.cos(pushAngle) * machinePhysicalRadius;
            w.y = ex.y + Math.sin(pushAngle) * machinePhysicalRadius;

            const nx = Math.cos(pushAngle);
            const ny = Math.sin(pushAngle);
            const dot = w.vx * nx + w.vy * ny;
            if (dot < 0) {
                w.vx -= 2 * dot * nx;
                w.vy -= 2 * dot * ny;
            }
            dx = w.x - ex.x;
            dy = w.y - ex.y;
            dist = machinePhysicalRadius;
        }

        // Keep workers patrolling within reasonable range of the machine
        if (dist > 390) {
            const angleToEx = Math.atan2(ex.y - w.y, ex.x - w.x) + (Math.random() - 0.5) * 0.65;
            const spd = Math.hypot(w.vx, w.vy) || 0.65;
            w.vx = Math.cos(angleToEx) * spd;
            w.vy = Math.sin(angleToEx) * spd;
        }

        const worldAngle = Math.atan2(dy, dx) + Math.PI / 2;
        const relAngle = worldAngle - ex.heading;
        const sector = getSectorForAngle(relAngle);
        w.sector = sector;

        const camDirt = state.cameras[sector].dirt;
        const canDetect = camDirt < state.dirtThresholdFail;
        w.detected = canDetect && dist < 245;

        const machineMoving = Math.abs(ex.speed) > 0.15 || state.keys.up || state.keys.down || state.keys.left || state.keys.right || Math.abs(ex.cabSwingVel) > 0.002;
        if (canDetect && dist < stopZoneRadius && (machineMoving || state.emergencyBraking)) {
            dangerTriggeredThisFrame = true;
        }
    }

    if (dangerTriggeredThisFrame) {
        if (!state.emergencyBraking) {
            state.emergencyBraking = true;
            ex.speed = 0;
            hmiAudio.playAutoStopAlert();
        }
        state.autoStopBannerUntil = Math.max(state.autoStopBannerUntil, Date.now() + 3000);
    } else if (!personInDangerZone) {
        state.emergencyBraking = false;
    }

    // Banner stays visible for at least 3 seconds OR until the person leaves the red Auto Stop range
    const showAutoStopBanner = state.emergencyBraking || Date.now() < state.autoStopBannerUntil;
    document.getElementById('emergencyBrakeBanner').classList.toggle('hidden', !showAutoStopBanner);
    syncCenterAutoStopIcon();

    // Raindrops
    for (const r of state.raindrops) {
        r.x -= 2.2;
        r.y += r.speed;
        if (r.y > canvasH) { r.y = -20; r.x = Math.random() * (canvasW + 100); }
        if (r.x < -30) { r.x = canvasW + 20; }
    }

    if (state.washerWave > 0) {
        state.washerWave = Math.max(0, state.washerWave - 0.035);
    }
}

// --- RENDERING 360° STITCHED CAMERA VIEW ---
function renderCameraView() {
    ctx.clearRect(0, 0, canvasW, canvasH);

    const cx = canvasW / 2;
    const cy = canvasH / 2 + 6;
    const ex = state.excavator;

    // 1. Ground & Muddy Terrain
    ctx.fillStyle = '#181615';
    ctx.fillRect(0, 0, canvasW, canvasH);

    const gridSize = 64;
    const offsetX = ((-ex.x % gridSize) + gridSize) % gridSize;
    const offsetY = ((-ex.y % gridSize) + gridSize) % gridSize;

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let x = offsetX; x < canvasW; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasH); ctx.stroke();
    }
    for (let y = offsetY; y < canvasH; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasW, y); ctx.stroke();
    }

    // Terrain mud patches
    ctx.fillStyle = 'rgba(68, 52, 38, 0.36)';
    for (const p of state.mudSplashes) {
        const sx = cx + (p.x - ex.x);
        const sy = cy + (p.y - ex.y);
        if (sx > -80 && sx < canvasW + 80 && sy > -80 && sy < canvasH + 80) {
            ctx.beginPath();
            ctx.arc(sx, sy, p.r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Caterpillar track marks left on ground
    for (const tm of state.trackMarks) {
        const sx = cx + (tm.x - ex.x);
        const sy = cy + (tm.y - ex.y);
        if (sx > -60 && sx < canvasW + 60 && sy > -60 && sy < canvasH + 60) {
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(tm.heading);
            ctx.fillStyle = 'rgba(10, 9, 8, 0.45)';
            ctx.fillRect(-25, -4, 11, 8);
            ctx.fillRect(14, -4, 11, 8);
            ctx.restore();
        }
    }

    // 2. Safety & Auto Stop Zone Rings
    const stopRadius = 96;
    const cautionRadius = 175;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, stopRadius, 0, Math.PI * 2);
    ctx.fillStyle = state.emergencyBraking ? 'rgba(239, 68, 68, 0.24)' : 'rgba(239, 68, 68, 0.08)';
    ctx.fill();
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = state.emergencyBraking ? '#ef4444' : 'rgba(239, 68, 68, 0.55)';
    ctx.stroke();

    // Outer advisory ring
    ctx.beginPath();
    ctx.arc(cx, cy, cautionRadius, 0, Math.PI * 2);
    ctx.setLineDash([3, 6]);
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.32)';
    ctx.stroke();

    // Swing Boundary Limit Arc & Sector Guides (relative to undercarriage heading)
    if (state.swingLimits.leftDeg !== null || state.swingLimits.rightDeg !== null) {
        const limitRadius = 124;
        const leftRad = state.swingLimits.leftDeg !== null ? (state.swingLimits.leftDeg * Math.PI) / 180 : Math.PI;
        const rightRad = state.swingLimits.rightDeg !== null ? (state.swingLimits.rightDeg * Math.PI) / 180 : Math.PI;
        const startArc = ex.heading - Math.PI / 2 - leftRad;
        const endArc = ex.heading - Math.PI / 2 + rightRad;

        ctx.beginPath();
        ctx.arc(cx, cy, limitRadius, startArc, endArc);
        ctx.setLineDash([]);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(249, 115, 22, 0.55)';
        ctx.stroke();

        if (state.swingLimits.leftDeg !== null) {
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(startArc) * 44, cy + Math.sin(startArc) * 44);
            ctx.lineTo(cx + Math.cos(startArc) * (limitRadius + 14), cy + Math.sin(startArc) * (limitRadius + 14));
            ctx.lineWidth = state.swingLimits.hitSide === 'left' ? 3.5 : 2;
            ctx.strokeStyle = state.swingLimits.hitSide === 'left' ? '#fb923c' : 'rgba(249, 115, 22, 0.75)';
            ctx.stroke();
        }

        if (state.swingLimits.rightDeg !== null) {
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(endArc) * 44, cy + Math.sin(endArc) * 44);
            ctx.lineTo(cx + Math.cos(endArc) * (limitRadius + 14), cy + Math.sin(endArc) * (limitRadius + 14));
            ctx.lineWidth = state.swingLimits.hitSide === 'right' ? 3.5 : 2;
            ctx.strokeStyle = state.swingLimits.hitSide === 'right' ? '#fb923c' : 'rgba(249, 115, 22, 0.75)';
            ctx.stroke();
        }
    }
    ctx.restore();

    // 3. Camera Stitch Wedge Overlays
    const wedges = [
        { key: 'front', start: -Math.PI * 0.75, end: -Math.PI * 0.25, labelPos: [0, -135] },
        { key: 'right', start: -Math.PI * 0.25, end: Math.PI * 0.25,  labelPos: [155, 0] },
        { key: 'rear',  start: Math.PI * 0.25,  end: Math.PI * 0.75,  labelPos: [0, 138] },
        { key: 'left',  start: Math.PI * 0.75,  end: Math.PI * 1.25,  labelPos: [-155, 0] }
    ];

    const maxRadius = Math.hypot(canvasW, canvasH);

    wedges.forEach(w => {
        const cam = state.cameras[w.key];
        const a1 = w.start + ex.heading;
        const a2 = w.end + ex.heading;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a1) * maxRadius, cy + Math.sin(a1) * maxRadius);
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.22)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        if (cam.dirt > 5) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, maxRadius, a1, a2);
            ctx.closePath();
            ctx.clip();

            const alpha = Math.min(0.84, (cam.dirt / 100) * 0.84);
            ctx.fillStyle = `rgba(74, 53, 35, ${alpha})`;
            ctx.fillRect(0, 0, canvasW, canvasH);

            const midAngle = (a1 + a2) / 2;
            const perpAngle = midAngle + Math.PI / 2;
            cam.blobs.forEach(b => {
                const dist = b.v * 230;
                const spread = b.u * dist * 0.85;
                const bx = cx + Math.cos(midAngle) * dist + Math.cos(perpAngle) * spread;
                const by = cy + Math.sin(midAngle) * dist + Math.sin(perpAngle) * spread;
                ctx.beginPath();
                ctx.arc(bx, by, b.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(54, 37, 22, ${b.opacity})`;
                ctx.fill();
            });

            if (cam.dirt >= state.dirtThresholdFail) {
                const lx = cx + Math.cos(midAngle) * 135;
                const ly = cy + Math.sin(midAngle) * 135;
                ctx.fillStyle = 'rgba(127, 29, 29, 0.92)';
                ctx.beginPath();
                ctx.roundRect(lx - 58, ly - 15, 116, 30, 8);
                ctx.fill();
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#fecaca';
                ctx.font = 'bold 10px "JetBrains Mono", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`${w.key.toUpperCase()} DIRT`, lx, ly - 2);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px "Inter", sans-serif';
                ctx.fillText('NO AUTO STOP', lx, ly + 10);
            }
            ctx.restore();
        }
    });

    // 4. Render Workers
    for (const w of state.workers) {
        const sx = cx + (w.x - ex.x);
        const sy = cy + (w.y - ex.y);
        if (sx < -40 || sx > canvasW + 40 || sy < -40 || sy > canvasH + 40) continue;

        const dist = Math.hypot(w.x - ex.x, w.y - ex.y);
        const inStopZone = dist < stopRadius;

        ctx.save();
        ctx.translate(sx, sy);

        const swing = Math.sin(w.walkPhase) * 3;
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 13 + Math.abs(swing) * 0.2, Math.atan2(w.vy, w.vx), 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 4.2, 0, Math.PI * 2);
        ctx.fill();

        if (w.detected) {
            const boxColor = inStopZone ? '#ef4444' : '#22c55e';
            ctx.strokeStyle = boxColor;
            ctx.lineWidth = 2.2;
            ctx.strokeRect(-16, -16, 32, 32);

            ctx.fillStyle = boxColor;
            ctx.beginPath();
            ctx.roundRect(-22, -31, 44, 13, 3);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 8px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('PERSON', 0, -22);
        }
        ctx.restore();
    }

    // 5. Top-Down Excavator with Animated Treads & Forward Arrow
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ex.heading);

    if (Math.abs(ex.speed) > 0.1 || state.keys.left || state.keys.right) {
        const dir = ex.speed >= 0 ? -1 : 1;
        ctx.fillStyle = 'rgba(250, 204, 21, 0.85)';
        ctx.beginPath();
        ctx.moveTo(0, dir * 56);
        ctx.lineTo(-7, dir * 46);
        ctx.lineTo(7, dir * 46);
        ctx.closePath();
        ctx.fill();
    }

    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-26, -34, 12, 68, 3);
    ctx.roundRect(14, -34, 12, 68, 3);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#94a3b8';
    const step = 11;
    const lShift = ((ex.leftTrackOffset % step) + step) % step;
    const rShift = ((ex.rightTrackOffset % step) + step) % step;
    for (let ty = -30 + lShift; ty < 32; ty += step) {
        ctx.fillRect(-25, -ty, 10, 2.5);
    }
    for (let ty = -30 + rShift; ty < 32; ty += step) {
        ctx.fillRect(15, -ty, 10, 2.5);
    }

    ctx.rotate(ex.cabAngle);

    ctx.fillStyle = '#f59e0b';
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-17, -22, 34, 46, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#334155';
    ctx.fillRect(-15, 16, 30, 7);

    ctx.fillStyle = '#0ea5e9';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect(-13, -15, 12, 20, 3);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#d97706';
    ctx.strokeStyle = '#451a03';
    ctx.beginPath();
    ctx.roundRect(2, -52, 7, 44, 3);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.roundRect(0, -62, 11, 12, 2);
    ctx.fill();

    const dotPositions = [
        { x: 0, y: -23, cam: 'front' },
        { x: 0, y: 24,  cam: 'rear' },
        { x: -18, y: 0, cam: 'left' },
        { x: 18, y: 0,  cam: 'right' }
    ];
    dotPositions.forEach(d => {
        const dirt = state.cameras[d.cam].dirt;
        ctx.fillStyle = dirt >= state.dirtThresholdFail ? '#ef4444' : (dirt >= state.dirtThresholdWarn ? '#f59e0b' : '#10b981');
        ctx.beginPath();
        ctx.arc(d.x, d.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.restore();

    // 6. Washer Spray Wave Effect
    if (state.washerWave > 0) {
        ctx.save();
        const radius = (1 - state.washerWave) * 260;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(56, 189, 248, ${state.washerWave * 0.7})`;
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.restore();
    }

    // 7. Rain Effect
    ctx.save();
    ctx.strokeStyle = 'rgba(186, 230, 253, 0.25)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (const r of state.raindrops) {
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - 3, r.y + r.len);
    }
    ctx.stroke();
    ctx.restore();
}

// --- MAIN LOOP ---
function loop() {
    updateSimulation();
    renderCameraView();
    requestAnimationFrame(loop);
}

window.onload = () => {
    initEnvironment();
    loop();
};
</script>
